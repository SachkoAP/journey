<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070605" />
  <title>Добавить статью — Спагетти мозга</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <h1>Новая статья</h1>
    <button class="icon-btn" onclick="window.location.href='index.html'" aria-label="Назад">
      ←
    </button>
  </header>
  
  <form class="form" id="addForm" novalidate>
    <input 
      type="text" 
      id="title" 
      placeholder="Заголовок статьи" 
      required 
      autocomplete="off"
      aria-label="Заголовок статьи"
    />
    <textarea 
      id="text" 
      placeholder="Напишите о своих мыслях, наблюдениях, идеях..." 
      required
      aria-label="Текст статьи"
    ></textarea>
    <select 
      id="themeSelect" 
      multiple 
      aria-label="Выберите темы"
      title="Удерживайте для выбора нескольких тем"
    >
      <option value="" disabled selected>Выберите темы (можно несколько)</option>
    </select>
    
    <div class="file-upload-section">
      <label for="imageUpload" class="file-upload-label">
        <span class="upload-icon">📷</span>
        <span>Загрузить фото</span>
      </label>
      <input 
        type="file" 
        id="imageUpload" 
        accept="image/*" 
        style="display: none;"
        onchange="handleImageUpload(event)"
      />
      <div id="imagePreview" class="image-preview"></div>
    </div>
    
    <div class="file-upload-section">
      <label for="fileUpload" class="file-upload-label">
        <span class="upload-icon">📎</span>
        <span>Загрузить файлы</span>
      </label>
      <input 
        type="file" 
        id="fileUpload" 
        multiple
        style="display: none;"
        onchange="handleFileUpload(event)"
      />
      <div id="filesList" class="files-preview"></div>
    </div>
    
    <button type="submit">Опубликовать</button>
  </form>
  
  <script src="js/telegram.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
